<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .bg-blur { fill: #0D0F14; fill-opacity: 0.92; }
      .modal { fill: #1A1D24; stroke: #383F4D; stroke-width: 2; rx: 12px; }
      .btn-primary { fill: #00C853; rx: 8px; cursor: pointer; }
      .btn-secondary { fill: #262B35; stroke: #454D5D; stroke-width: 1.5; rx: 8px; cursor: pointer; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 36px; font-weight: 800; fill: #FFD54F; text-anchor: middle; }
      .text-heading { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 19px; font-weight: 700; fill: #FFFFFF; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; fill: #A5ACB9; }
      .text-stat-val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #FFFFFF; text-anchor: end; }
      .text-btn { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; dominant-baseline: middle; }
      .reward-card { fill: #20242D; stroke: #3D4454; stroke-width: 1.5; rx: 8px; }
      .xp-bar-bg { fill: #272C36; rx: 6px; }
      .xp-bar-fill { fill: #AB47BC; rx: 6px; }
    </style>
  </defs>

  <rect width="1920" height="1080" class="bg-blur" />

  <!-- Center Result Modal -->
  <g transform="translate(510, 140)">
    <rect width="900" height="800" class="modal" />

    <!-- Victory Banner Header -->
    <text x="450" y="70" class="text-title">CHIẾN DỊCH HOÀN THÀNH!</text>
    <text x="450" y="105" class="text-body" text-anchor="middle" fill="#81C784">Bạn đã quét sạch quái vật &amp; phá vỡ Mạch Năng Lượng phòng thủ</text>
    <line x1="50" y1="130" x2="850" y2="130" stroke="#2B313D" stroke-width="1.5" />

    <!-- SECTION 1: BATTLE STATISTICS (Bảng thống kê chiến đấu) -->
    <g transform="translate(60, 160)">
      <text x="0" y="25" class="text-heading">THỐNG KÊ CHIẾN TÍCH</text>
      
      <!-- Stat 1: Kills -->
      <g transform="translate(0, 45)">
        <text x="0" y="20" class="text-body">Kẻ địch đã tiêu diệt:</text>
        <text x="360" y="20" class="text-stat-val">24 Quái thường + 2 Tinh Anh</text>
      </g>
      <!-- Stat 2: Total Damage -->
      <g transform="translate(0, 85)">
        <text x="0" y="20" class="text-body">Tổng sát thương gây ra:</text>
        <text x="360" y="20" class="text-stat-val" fill="#FF8A80">35,400 DMG</text>
      </g>
      <!-- Stat 3: Time Elapsed -->
      <g transform="translate(0, 125)">
        <text x="0" y="20" class="text-body">Thời gian hoàn thành:</text>
        <text x="360" y="20" class="text-stat-val">03 phút 45 giây</text>
      </g>
      <!-- Stat 4: Remaining HP -->
      <g transform="translate(0, 165)">
        <text x="0" y="20" class="text-body">Lượng HP còn lại:</text>
        <text x="360" y="20" class="text-stat-val" fill="#69F0AE">92%</text>
      </g>
    </g>

    <!-- SECTION 2: TANK PROGRESS (Tiến trình Cấp độ 1-90) -->
    <g transform="translate(480, 160)">
      <text x="0" y="25" class="text-heading">TIẾN TRÌNH XE TĂNG</text>
      <text x="0" y="65" class="text-body">Wall Titan: Cấp 1 ➔ <tspan fill="#E1BEE7" font-weight="700">Đủ điều kiện lên Cấp 2</tspan></text>
      <rect x="0" y="85" width="360" height="14" class="xp-bar-bg" />
      <rect x="0" y="85" width="280" height="14" class="xp-bar-fill" />
      <text x="360" y="125" class="text-body" text-anchor="end" font-size="13">Cần 5 Ngọc Ma Pháp để tăng cấp</text>
    </g>

    <line x1="50" y1="380" x2="850" y2="380" stroke="#2B313D" stroke-width="1.5" />

    <!-- SECTION 3: REWARDS / LOOT (Chiến lợi phẩm theo đúng GDD) -->
    <g transform="translate(60, 410)">
      <text x="0" y="25" class="text-heading">CHIẾN LỢI PHẨM THU ĐƯỢC</text>

      <g transform="translate(0, 50)">
        <!-- Loot 1: Ngọc ma pháp -->
        <rect width="240" height="110" class="reward-card" stroke="#BA68C8" />
        <text x="25" y="45" class="text-stat-val" font-size="24" fill="#E1BEE7" text-anchor="start">+15 💎</text>
        <text x="25" y="75" class="text-body">Ngọc Ma Pháp nâng cấp</text>

        <!-- Loot 2: Rơi Phụ Kiện Ngẫu Nhiên -->
        <g transform="translate(265, 0)">
          <rect width="240" height="110" class="reward-card" stroke="#FF9800" />
          <text x="25" y="45" class="text-stat-val" font-size="18" fill="#FFB74D" text-anchor="start">RƠI PHỤ KIỆN</text>
          <text x="25" y="75" class="text-body">Trái Tim Nham Thạch (Tinh Anh)</text>
        </g>

        <!-- Loot 3: Mở khóa Tank mới -->
        <g transform="translate(530, 0)">
          <rect width="240" height="110" class="reward-card" stroke="#4CAF50" />
          <text x="25" y="45" class="text-stat-val" font-size="18" fill="#81C784" text-anchor="start">TIẾN ĐỘ XE</text>
          <text x="25" y="75" class="text-body">Mảnh xe Green Fox (1/3)</text>
        </g>
      </g>
    </g>

    <!-- SECTION 4: ACTIONS -->
    <g transform="translate(100, 680)">
      <g transform="translate(0, 0)">
        <rect width="320" height="60" class="btn-secondary" />
        <text x="160" y="30" class="text-btn">VỀ NHÀ XE (HANGAR)</text>
      </g>

      <g transform="translate(380, 0)">
        <rect width="320" height="60" class="btn-primary" />
        <text x="160" y="30" class="text-btn">ẢI TIẾP THEO ➔</text>
      </g>
    </g>
  </g>
</svg>