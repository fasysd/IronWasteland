<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .bg-gameplay { fill: #111417; }
      .hud-panel { fill: rgba(24, 27, 33, 0.88); stroke: #383E4B; stroke-width: 1.5; rx: 8px; }
      .bar-bg { fill: #20242B; rx: 4px; }
      .hp-bar { fill: #00E676; rx: 4px; }
      .energy-bar { fill: #00B0FF; rx: 4px; }
      .boss-bar { fill: #FF1744; rx: 4px; }
      .boss-shield-bar { fill: #7C4DFF; rx: 4px; }
      .text-heading { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #FFFFFF; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 600; fill: #FFFFFF; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #B0B5C1; }
      .text-hotkey { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 800; fill: #FFD54F; }
      .text-cd { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 800; fill: #FFFFFF; text-anchor: middle; dominant-baseline: middle; }
      .skill-slot { fill: #1D2128; stroke: #4F5565; stroke-width: 2; rx: 12px; }
      .skill-slot-opt { fill: #1E2838; stroke: #3D6EFF; stroke-width: 2; rx: 12px; }
      .hotkey-badge { fill: #2F3542; stroke: #57606F; stroke-width: 1; rx: 4px; }
    </style>
  </defs>

  <rect width="1920" height="1080" class="bg-gameplay" />

  <!-- Gameplay Arena Grid Placeholder -->
  <g stroke="#1A1F26" stroke-width="1">
    <line x1="0" y1="270" x2="1920" y2="270" />
    <line x1="0" y1="540" x2="1920" y2="540" />
    <line x1="0" y1="810" x2="1920" y2="810" />
    <line x1="480" y1="0" x2="480" y2="1080" />
    <line x1="960" y1="0" x2="960" y2="1080" />
    <line x1="1440" y1="0" x2="1440" y2="1080" />
  </g>

  <!-- Center Gameplay Battlefield Placeholder -->
  <g transform="translate(960, 540)">
    <!-- Player Tank (Wall Titan) Wireframe -->
    <rect x="-45" y="-40" width="90" height="80" rx="8" fill="#3E2C22" stroke="#8D6E63" stroke-width="2.5" />
    <line x1="0" y1="0" x2="65" y2="-15" stroke="#D7CCC8" stroke-width="8" stroke-linecap="round" />
    <circle cx="0" cy="0" r="20" fill="#2E1C12" stroke="#A1887F" stroke-width="2" />
    <text x="0" y="60" class="text-body" text-anchor="middle" fill="#BCAAA4">P1: Wall Titan (Bạn)</text>

    <!-- Crosshair Aim Indicator -->
    <circle cx="280" cy="-140" r="14" fill="none" stroke="#FF5252" stroke-width="2" />
    <circle cx="280" cy="-140" r="3" fill="#FF5252" />
    <line x1="260" y1="-140" x2="272" y2="-140" stroke="#FF5252" stroke-width="2" />
    <line x1="288" y1="-140" x2="300" y2="-140" stroke="#FF5252" stroke-width="2" />
    <line x1="280" y1="-160" x2="280" y2="-148" stroke="#FF5252" stroke-width="2" />
    <line x1="280" y1="-132" x2="280" y2="-120" stroke="#FF5252" stroke-width="2" />

    <!-- Enemy Wireframe -->
    <rect x="250" y="-280" width="70" height="60" rx="6" fill="#4A2020" stroke="#FF3838" stroke-width="2" />
    <text x="285" y="-290" class="text-body" text-anchor="middle" fill="#FF6B6B">Alien Elite</text>

    <!-- Damage Text (TextDamageManager) -->
    <text x="320" y="-210" font-family="Impact, sans-serif" font-size="28" fill="#FFD54F" font-weight="bold">-450 CRIT!</text>
  </g>

  <!-- ==================== TOP-LEFT: PLAYER STATUS & PASSIVE ==================== -->
  <g transform="translate(40, 30)">
    <rect width="450" height="115" class="hud-panel" />
    
    <!-- Player Avatar Thumbnail -->
    <rect x="15" y="15" width="85" height="85" rx="8" fill="#231A15" stroke="#8D6E63" stroke-width="2" />
    <text x="57" y="60" class="text-heading" text-anchor="middle" font-size="13" fill="#D7CCC8">WALL TITAN</text>

    <!-- HP Bar -->
    <g transform="translate(115, 20)">
      <text x="0" y="12" class="text-title" font-size="13">HP: 1,120 / 1,200</text>
      <rect x="0" y="18" width="310" height="18" class="bar-bg" />
      <rect x="0" y="18" width="285" height="18" class="hp-bar" />
    </g>

    <!-- Energy Bar -->
    <g transform="translate(115, 62)">
      <text x="0" y="12" class="text-title" font-size="13">NĂNG LƯỢNG: 80 / 100</text>
      <rect x="0" y="18" width="310" height="14" class="bar-bg" />
      <rect x="0" y="18" width="248" height="14" class="energy-bar" />
    </g>

    <!-- Passive Icon from Equipment -->
    <circle cx="430" cy="98" r="12" fill="#3E2723" stroke="#FFB74D" stroke-width="1.5" />
    <text x="430" y="102" class="text-sub" font-size="10" fill="#FFD54F" text-anchor="middle">🛡</text>
  </g>

  <!-- ==================== TOP-CENTER: OBJECTIVE & BOSS TRACKER ==================== -->
  <g transform="translate(690, 30)">
    <rect width="540" height="75" class="hud-panel" />
    <text x="270" y="28" class="text-heading" text-anchor="middle" font-size="16">ẢI 1-3 • ĐỘT KÍCH VÀNH ĐAI (ĐỢT 2 / 3)</text>
    <text x="270" y="52" class="text-body" text-anchor="middle" fill="#FFD54F">Mục tiêu: Tiêu diệt quái vật Alien để mở đường</text>

    <!-- Boss Bar (Hiển thị cả Mạch Năng Lượng theo GDD) -->
    <g transform="translate(0, 85)">
      <rect width="540" height="42" class="hud-panel" fill="rgba(35, 12, 15, 0.92)" stroke="#B71C1C" />
      <text x="15" y="18" class="text-title" font-size="12" fill="#FF8A80">BOSS: THE2FACE (PHÓ QUẢN NGỤC)</text>
      <!-- Shield / Mạch Năng Lượng -->
      <text x="15" y="34" class="text-sub" font-size="11" fill="#B388FF">Mạch Năng Lượng:</text>
      <rect x="135" y="24" width="390" height="10" class="bar-bg" />
      <rect x="135" y="24" width="310" height="10" class="boss-shield-bar" />
      <!-- Boss HP Bar -->
      <rect x="235" y="8" width="290" height="12" class="bar-bg" />
      <rect x="235" y="8" width="240" height="12" class="boss-bar" />
    </g>
  </g>

  <!-- ==================== TOP-RIGHT: RADAR & SETTING BUTTON (THAY CHO PAUSE) ==================== -->
  <g transform="translate(1660, 30)">
    <!-- Minimap / Radar -->
    <rect width="220" height="220" class="hud-panel" rx="110" fill="rgba(16, 22, 28, 0.9)" />
    <circle cx="110" cy="110" r="95" fill="none" stroke="#253545" stroke-width="1.5" />
    <circle cx="110" cy="110" r="55" fill="none" stroke="#253545" stroke-width="1" stroke-dasharray="4 4" />
    <!-- Blips -->
    <circle cx="110" cy="110" r="5" fill="#4C82FF" />
    <circle cx="140" cy="85" r="4" fill="#FF5252" />
    <circle cx="155" cy="70" r="4" fill="#FF5252" />
    <circle cx="80" cy="150" r="4" fill="#00E676" />
    <text x="110" y="200" class="text-body" font-size="11" text-anchor="middle">RADAR VÙNG (200m)</text>

    <!-- NÚT SETTING (VÌ CÓ CO-OP NÊN GAME KHÔNG PAUSE ĐƯỢC) -->
    <g transform="translate(-70, 0)">
      <rect width="52" height="52" class="hud-panel" rx="8" />
      <!-- Gear Icon Placeholder -->
      <text x="26" y="28" class="text-heading" text-anchor="middle" font-size="20">⚙</text>
      <text x="26" y="44" class="text-sub" font-size="10" text-anchor="middle">CÀI ĐẶT</text>
      <!-- Hotkey badge ESC -->
      <rect x="11" y="58" width="30" height="16" class="hotkey-badge" />
      <text x="26" y="70" class="text-hotkey" text-anchor="middle" font-size="10">ESC</text>
    </g>
  </g>

  <!-- ==================== BOTTOM-LEFT: CO-OP TEAMMATES STATUS ==================== -->
  <g transform="translate(40, 860)">
    <rect width="280" height="180" class="hud-panel" />
    <text x="20" y="30" class="text-title" font-size="14">ĐỒNG ĐỘI CO-OP (PHÒNG 2/4)</text>
    
    <!-- P2 IronClad -->
    <g transform="translate(20, 45)">
      <rect width="240" height="50" fill="#1B1E26" rx="6" />
      <text x="12" y="22" class="text-title" font-size="13">P2: IronClad (Red Nova)</text>
      <rect x="12" y="28" width="216" height="10" class="bar-bg" />
      <rect x="12" y="28" width="180" height="10" class="hp-bar" />
    </g>

    <!-- Slot P3 P4 Empty -->
    <g transform="translate(20, 105)">
      <rect width="240" height="50" fill="#171920" stroke="#282C35" stroke-dasharray="4 4" rx="6" />
      <text x="120" y="30" class="text-body" text-anchor="middle" font-size="12">[ Slot 3 &amp; 4 Trống ]</text>
    </g>
  </g>

  <!-- ==================== BOTTOM-RIGHT: 4 ABILITY SLOTS (THƯỜNG, CHUYÊN BIỆT, 2 TÙY CHỌN) ==================== -->
  <g transform="translate(1330, 880)">
    <!-- Skill 1: Kỹ Năng Thường (Phím J) -->
    <g transform="translate(0, 30)">
      <rect width="110" height="110" class="skill-slot" />
      <text x="55" y="42" class="text-title" text-anchor="middle" font-size="13">EARTH BREAK</text>
      <text x="55" y="62" class="text-sub" text-anchor="middle" fill="#81C784">+10 Năng lượng</text>
      <!-- Hotkey badge -->
      <rect x="40" y="85" width="30" height="20" class="hotkey-badge" />
      <text x="55" y="99" class="text-hotkey" text-anchor="middle">J</text>
    </g>

    <!-- Skill 2: Kỹ Năng Chuyên Biệt (Phím K) -->
    <g transform="translate(130, 30)">
      <rect width="110" height="110" class="skill-slot" />
      <text x="55" y="42" class="text-title" text-anchor="middle" font-size="13">EARTH WALL</text>
      <text x="55" y="62" class="text-sub" text-anchor="middle">-45 En • Tường đá</text>
      <!-- Cooldown Mask Example (Simulating 4.5s CD) -->
      <rect width="110" height="110" fill="rgba(0,0,0,0.65)" rx="12" />
      <text x="55" y="55" class="text-cd">4.5s</text>
      <!-- Hotkey badge -->
      <rect x="40" y="85" width="30" height="20" class="hotkey-badge" />
      <text x="55" y="99" class="text-hotkey" text-anchor="middle">K</text>
    </g>

    <!-- Skill 3: Kỹ Năng Tùy Chọn 1 (Phím L) -->
    <g transform="translate(260, 30)">
      <rect width="110" height="110" class="skill-slot-opt" />
      <text x="55" y="42" class="text-title" text-anchor="middle" font-size="12">STONE FORTRESS</text>
      <text x="55" y="62" class="text-sub" text-anchor="middle" fill="#90CAF9">Khiên + Hồi HP</text>
      <!-- Hotkey badge -->
      <rect x="40" y="85" width="30" height="20" class="hotkey-badge" stroke="#3D6EFF" />
      <text x="55" y="99" class="text-hotkey" text-anchor="middle">L</text>
    </g>

    <!-- Skill 4: Kỹ Năng Tùy Chọn 2 (Phím I) -->
    <g transform="translate(390, 15)">
      <rect width="125" height="125" class="skill-slot-opt" stroke="#FF9800" stroke-width="2.5" />
      <text x="62" y="45" class="text-title" text-anchor="middle" fill="#FFB74D" font-size="14">TREMOR</text>
      <text x="62" y="68" class="text-sub" text-anchor="middle" fill="#FFE082">Địa chấn Choáng</text>
      <!-- Ready status -->
      <rect x="18" y="85" width="90" height="6" class="bar-bg" />
      <rect x="18" y="85" width="90" height="6" fill="#FF9800" rx="3" />
      <!-- Hotkey badge -->
      <rect x="47" y="-12" width="30" height="22" class="hotkey-badge" stroke="#FF9800" />
      <text x="62" y="3" class="text-hotkey" text-anchor="middle">I</text>
    </g>
  </g>
</svg>